name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    # rust-toolchain.toml pins the nightly. `+nightly` would ignore it.
    - name: Install pinned toolchain
      run: rustup show
    - name: Install QEMU and OVMF
      run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
    - name: Build
      run: cargo build -Z build-std
    - name: Lint
      run: cargo clippy
    - name: Run unit tests
      run: cargo test --lib
    - name: Run integration tests
      run: cargo test --test '*'
